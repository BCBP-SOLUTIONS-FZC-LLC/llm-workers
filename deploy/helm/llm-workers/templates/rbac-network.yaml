apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  {{- if .Values.serviceAccount.irsaRoleArn }}
  annotations: { eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.irsaRoleArn | quote }} }
  {{- end }}
---
# Egress only to the dependencies in §2.4; ingress only for probes and metrics scraping (§14.3).
# Selectors are placeholders until the platform names the peers' labels (PL-3, open).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: llm-workers, namespace: {{ .Values.namespace }} }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: llm-workers } }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ port: 8080 }, { port: 9464 }]
{{- with .Values.networkPolicy.ingressFrom }}
      from: {{ toYaml . | nindent 8 }}
{{- end }}
  egress:
{{- if .Values.networkPolicy.egress }}
{{ toYaml .Values.networkPolicy.egress | indent 4 }}
{{- else }}
    - {}   # allow all: the platform has not named the labels (PL-3). Set networkPolicy.egress to narrow it to {{ join ", " .Values.networkPolicy.egressTo }}
{{- end }}
