# Reusable workflow — test gate.
# Unit, workflow (Temporal time-skipping), replay, security and integration tests in one coverage
# run + 95% gate. Called by ci.yml and release.yml.
name: Validate / Test

"on":
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out (leave empty to use the caller ref)'
        type: string
        required: false
        default: ''
    secrets:
      CI_REPO_READ_TOKEN:
        required: false
      GO_PRIVATE_TOKEN:
        required: true
    outputs:
      pct:
        description: 'Total statement coverage percentage'
        value: ${{ jobs.test.outputs.pct }}

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pct: ${{ steps.gate.outputs.pct }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Engine git access
        # the credential helper reads the token from the environment of the step that fetches (uv sync, the engine
        # clone); nothing is written to disk and later steps (tests, which run this branch's code) do not get the token
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global credential.helper "!f() { echo username=x-access-token; echo password=\${GO_PRIVATE_TOKEN}; }; f"

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.6'
          python-version: '3.15.2'

      - name: Install dependencies (uv sync from uv.lock)
        env:
          GO_PRIVATE_TOKEN: ${{ secrets.GO_PRIVATE_TOKEN }}
        run: uv sync --locked --package llm-workers-generation --group dev

      # WV-3: recorded workflow histories still replay.
      - name: Replay
        run: make replay

      # Blocking gate: the whole suite in ONE coverage run. The Temporal test server is downloaded on first use.
      # The Observability Standard: the platform linter over the real scrape of both endpoints.
      - name: Metric lint
        run: make metrics-lint

      - name: Tests (coverage)
        run: make test-ci

      - name: Coverage threshold gate (≥ 95%)
        id: gate
        env:
          COVERAGE_THRESHOLD: 95
        run: bash .github/scripts/coverage-gate.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 30
